          query-args:
            # M=128 rebuild+rpq128 GIST-960. Compact format: [np, ef, ncs=128, psm=24, crinn=0, rpqgm=auto, eps=auto, srg=-1, feef=-1]
            #   np    — n_probe: cluster probes (sweep this for recall/QPS tradeoff)
            #   ef    — beam size (higher = better recall, lower QPS)
            #   ncs   — n_cluster_seeds per probe (default 128, optimal across all ef)
            #   psm   — presort_seed_mult: RPQ-ranked fp16 seed cap (default 24, +17-31% QPS)
            #   crinn — crinn_no_improve_limit: 0 = C++ auto (ef*2/3) (default 0)
            #   rpqgm — beam_rpq_gate_margin: -1=off, auto=0.3(ef<80)/0.2(ef≥80)
            #   eps   — term_eps_fp16: -1=off, auto=0.3(ef<80,lossless)/−1(ef≥80)
            #   srg   — seed_rpq_gate: RPQ score threshold to early-filter seeds (-1=off)
            #   feef  — fp16_early_exit_factor: fp16 beam early-exit factor (-1=off)
            #
            # Auto defaults produce near-optimal results — just sweep [np, ef]:
            #   [24, 60] → psm=24 crinn=auto(40) rpqgm=0.3 eps=0.3 → recall~0.95 @ ~1650 QPS ★
            #   [32, 80] → psm=24 crinn=auto(53) rpqgm=0.2 eps=-1  → recall~0.96 @ ~1350 QPS
            #   [48,128] → psm=24 crinn=auto(85) rpqgm=0.2 eps=-1  → recall~0.98 @ ~860  QPS
            #
            # Measured Pareto points (11 reps trimmed mean, n_threads=8):
            #   np=16 ef=60                              → 0.9227 @ 1663 QPS
            #   np=20 ef=60                              → 0.9401 @ 1769 QPS (crinn=24 auto-tuned)
            #   np=20 ef=60 ncs=96                       → 0.9392 @ 1906 QPS ★ fastest ~0.94
            #   np=24 ef=60                              → 0.9521 @ 1621 QPS ★ best ef=60
            #   np=32 ef=80                              → 0.9645 @ 1308 QPS ★ best ef=80 (rpqgm=0.2)
            #   np=32 ef=80 rpqgm=off                    → 0.9759 @  858 QPS   high recall ef=80
            #   np=48 ef=128 crinn=80 rpqgm=off          → 0.9902 @  820 QPS ★ best recall ≥0.99
            #   np=48 ef=128 (auto rpqgm=0.2)            → 0.9806 @  861 QPS ★ best ef=128 QPS
            #   np=48 ef=128 crinn=80 rpqgm=0.2 eps=0.05 → 0.9754 @  951 QPS   highest QPS ef=128
            #   np=48 ef=200 ncs=64 psm=24 rpqgm=off     → 0.9913 @  754 QPS (8T); 931 QPS (16T) ★ best recall ≥0.99 high-thread
            #   np=48 ef=200 ncs=64 psm=24 crinn=90           → 0.9901 @ 1039 QPS (16T) ★ QPS>1000 recall ≥0.99
            #   np=48 ef=200 ncs=64 psm=24 crinn=92                → 0.9901 @ 1052 QPS (16T) ★ QPS>1000 recall ≥0.99
            #   np=48 ef=200 ncs=64 psm=24 crinn=92 srg=0.2        → 0.9902 @ 1069 QPS (16T) ★ QPS>1000 recall ≥0.99
            #   np=48 ef=200 ncs=64 psm=24 crinn=92 srg=0.2 feef=0.05 → 0.9902 @ 1073 QPS (16T) (+4 QPS vs srg alone ≈ noise)
            #   np=48 ef=200 ncs=64 psm=24 crinn=100               → 0.9905 @ 1003 QPS (16T)
            #   np=40 ef=200 ncs=64 psm=24 crinn=100               → 0.9869 @ 1218 QPS (16T) — recall ceiling 0.987 (np insufficient)
            #   np=56 ef=200 ncs=64 psm=24 crinn=70                → 0.9913 @  945 QPS (16T) (no srg)
            #   np=56 ef=200 ncs=64 psm=24 crinn=65 srg=0.2        → 0.9905 @ 1018 QPS (16T) ✗ Pareto-dominated by crinn=70
            #   np=56 ef=200 ncs=64 psm=24 crinn=70 srg=0.15       → 0.9906 @ 1117 QPS (16T) ★ +172 QPS vs no-srg
            #   np=56 ef=200 ncs=64 psm=24 crinn=70 srg=0.2        → 0.9909 @ 1146 QPS (16T) ★ best fp16 (see sq4 run-group for +15.5% QPS)
            #   np=64 ef=200 ncs=64 psm=24 crinn=60 srg=0.2        → 0.9911 @ 1035 QPS (16T) ★ Pareto (recall↑, QPS↓ vs np=56)
            #   np=64 ef=200 ncs=64 psm=24 crinn=70 srg=0.2        → 0.9925 @  954 QPS (16T) ★ high-recall Pareto
