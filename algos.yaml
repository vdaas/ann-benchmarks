               [48, 128, 128, 24, 80, 0.2, 0.05],
               # ef=200 ncs=64: best recall ≥0.99 at high thread counts (16T: 931 QPS)
               [48, 200,  64, 24,  0, -1.0],
               # ef=200 ncs=64 crinn=90: QPS>1000 at recall ≥0.99 (16T: 1039 QPS avg)
               [48, 200,  64, 24,  90, -1.0],
               # ef=200 ncs=64 crinn=92: QPS>1000 at recall ≥0.99 (16T: 1052 QPS avg)
               [48, 200,  64, 24,  92, -1.0],
               # ef=200 ncs=64 crinn=92 srg=0.2: recall=0.9902 @ 1069 QPS avg (16T) ✗ dominated by np=56 crinn=70 srg=0.2 (1146 QPS)
               [48, 200,  64, 24,  92, -1.0, -1.0, 0.2],
               # ef=200 ncs=64 crinn=92 srg=0.2 feef=0.05: recall=0.9902 @ 1073 QPS (16T, +4 QPS ≈ noise) ✗ dominated
               [48, 200,  64, 24,  92, -1.0, -1.0, 0.2, 0.05],
               # ef=200 ncs=64 crinn=100: QPS>1000 at recall ≥0.99 (16T: 1003 QPS)
               [48, 200,  64, 24, 100, -1.0],
               # ef=200 ncs=64 crinn=70 np=56: no-srg baseline (16T: 945 QPS avg, recall=0.9913)
               [56, 200,  64, 24,  70, -1.0],
               # ef=200 ncs=64 crinn=70 np=56 srg=0.15: recall=0.9906 @ 1117 QPS (16T) ★ high-recall Pareto
               [56, 200,  64, 24,  70, -1.0, -1.0, 0.15],
