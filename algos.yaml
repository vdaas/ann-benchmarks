               [48, 200, 128, 0, 0, -1.0, -1.0],
               [64, 200, 128, 0, 0, -1.0, -1.0],
               [64, 300, 192, 0, 0, -1.0, -1.0],
               [80, 300, 192, 0, 0, -1.0, -1.0, 0.2],
               [96, 400, 256, 0, 0, -1.0, -1.0, 0.2]]
        a140-l2-rpq128:
          args: [{'alpha': 1.4, 'max_edges': 64, 'k_clusters': 256, 'n_entry_points': 32, 'n_cluster_seeds': 128, 'reorder': 'gorder', 'routing_pq_m': 128}]
          query-args:
            # [ge, gt, np, mv, rf, ef, cap, eps, rr8, pe, en, ncs]
            # routing_pq_m=128: Fashion-MNIST D=784→D_sub=6; GIST-960→D_sub=7.5; SIFT-128→D_sub=1
            # Finer routing PQ granularity vs default M=64 — expected +2-5% QPS on high-dim datasets
            - [[0.0, -1.0,  4, 0, 0, 30, 0, -1.0, 0, 0, 0,  4],
               [0.0, -1.0,  4, 0, 0, 40, 0, -1.0, 0, 0, 0,  8],
