          query-args:
            # [ge, gt, np, mv, rf, ef]
            # recall>0.99 @ QPS>8000 confirmed: np=32, ef=230-242
            - [[0.0, -1.0, 32, 0, 0, 228],
               [0.0, -1.0, 32, 0, 0, 230],
               [0.0, -1.0, 32, 0, 0, 232],
