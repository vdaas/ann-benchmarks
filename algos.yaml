    ArcFlare-Cap:
      docker-tag: ann-benchmarks-arcflare
      module: ann_benchmarks.algorithms.arcflare
      constructor: ArcFlare
      base-args: ["@metric"]
      run-groups:
        e64-k256-a150-v3-cap:
          args: [{'alpha': 1.5, 'max_edges': 64, 'k_clusters': 256, 'n_entry_points': 32, 'n_cluster_seeds': 128, 'reorder': 'gorder'}]
          query-args:
            # [ge, gt, np, mv, rf, ef, cap]
            # cap_cluster_members: score only nearest cap members per cluster
            # nearest_n_fp16 gives truly-nearest clusters; cap allows higher n_probe at fraction of cost
            # np=60 cap=200: 60×200=12K seeds vs np=36 no-cap: 36×3906=140K seeds (12× faster seeding)
            # Target: recall>0.99 @ QPS>7315
            - [[0.0, -1.0, 60, 0, 0, 120, 200],
               [0.0, -1.0, 60, 0, 0, 140, 200],
               [0.0, -1.0, 60, 0, 0, 160, 200],
