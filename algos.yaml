  angular:
    ArcFlare-A140-Ang-K1024:
      docker-tag: ann-benchmarks-arcflare
      module: ann_benchmarks.algorithms.arcflare
      constructor: ArcFlare
      base-args: ["@metric"]
      run-groups:
        a140-ang-k1024-fp16:
          args: [{'alpha': 1.4, 'max_edges': 64, 'k_clusters': 1024, 'n_entry_points': 32, 'n_cluster_seeds': 128, 'reorder': 'gorder'}]
          query-args:
            # [ge, gt, np, mv, rf, ef]
            # K=1024 multi-tier rebuild — GloVe-100 validated Pareto front (80T warm):
            # recall=0.7751@39926, 0.8145@29611, 0.8413@21337, 0.9008@8873, 0.9394@5040, 0.9882@1061
            # NYTimes-256 K=1024 sweep (80T fp16, ncs≈128 default):
            #   np=1  ef=10  → 0.5699@56802
            #   np=2  ef=20  → 0.6302@51666
            #   np=4  ef=20  → 0.6794@43668
            #   np=8  ef=30  → 0.7281@34380
            #   np=16 ef=80  → 0.7837@19613
            #   np=32 ef=200 → 0.8458@6031  (Glass max: 0.9584@5392)
            #   np=64 ef=500 → 0.9042@1669
            #   np=80 ef=600 → 0.9214@1198
