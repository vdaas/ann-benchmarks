        e64-k256-a150-v2-pareto:
          args: [{'alpha': 1.5, 'max_edges': 64, 'k_clusters': 256, 'n_entry_points': 32, 'n_cluster_seeds': 128, 'reorder': 'gorder'}]
          query-args:
            # [ge, gt, np, mv, rf, ef]
            # Fill Pareto frontier gaps — target recall>0.99 @ QPS>8000
            # np=20: explore high-QPS end (estimated QPS=13K-20K)
            # np=28,32 ef=160-200: bridge the gap between current Pareto points
            - [[0.0, -1.0, 20, 0, 0, 80],
               [0.0, -1.0, 20, 0, 0, 100],
               [0.0, -1.0, 20, 0, 0, 120],
               [0.0, -1.0, 20, 0, 0, 140],
               [0.0, -1.0, 20, 0, 0, 160],
               [0.0, -1.0, 28, 0, 0, 160],
               [0.0, -1.0, 28, 0, 0, 180],
               [0.0, -1.0, 28, 0, 0, 200],
               [0.0, -1.0, 32, 0, 0, 180],
               [0.0, -1.0, 32, 0, 0, 200],
