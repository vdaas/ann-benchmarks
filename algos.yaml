  angular:
    ArcFlare-A140-Ang-K1024:
      docker-tag: ann-benchmarks-arcflare
      module: ann_benchmarks.algorithms.arcflare
      constructor: ArcFlare
      base-args: ["@metric"]
      run-groups:
        a140-ang-m96k1024-hnswgraft:  # GloVe-100 / NYTimes-256 (crinn hurts angular here: keep -1)
          args: [{'alpha': 1.4, 'max_edges': 96, 'k_clusters': 1024, 'n_entry_points': 32, 'n_cluster_seeds': 128, 'reorder': 'gorder', 'graph': 'hnsw'}]
          query-args:
            # 1T non-batch (Zen2 AVX2, 2026-07-02), format [np, ef, ncs, psm, crinn]:
            # GloVe 1T: [2,128,32]=0.9055@1759 [4,256,64]=0.9465@1090 [8,512,64]=0.9728@646
            #           [8,1024,64]=0.9861@370 [16,2048,64]=0.9924@198 [32,4096,64]=0.9941@99
            # NYTimes 1T: [2,128,32]=0.9296@1381 [4,256,32]=0.9493@860 [8,512,64]=0.9657@501
            #             [8,1024,64]=0.9750@275 [16,2048,64]=0.9803@140
            - [[2, 128, 32, 8, -1],
               [4, 256, 32, 8, -1],
               [4, 256, 64, 8, -1],
               [8, 512, 64, 8, -1],
               [8, 1024, 64, 8, -1],
               [16, 2048, 64, 8, -1],
               [32, 4096, 64, 8, -1]]
        a140-ang-m96k1024-hnswgraft-teps:  # ADDITIVE: term_eps A/B vs a140-ang-m96k1024-hnswgraft
          # (champion-hnswgraft-recalibrate, 2026-07-24). Per-point calibrated teps (NOT a single
          # constant -- verified bit-identical recall on BOTH glove-100-angular AND
          # nytimes-256-angular simultaneously, T1, build/cmd/arcflare direct). np<=4 (recall<0.95)
