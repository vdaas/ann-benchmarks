            # sq4_pfah sweep (2026-07-01, 7-run, Zen2 80T, np=43 ef=152 crinn=63 psm=16 srg=0.10):
            #   pfah=16: QPS_mean=2278  pfah=24: QPS_mean=2401  pfah=32: QPS_mean=2305
