               [0.0, -1.0, 20, 0, 0, 220, 0, 0.340],
               [0.0, -1.0, 20, 0, 0, 260, 0, 0.345],
               # Mid recall (0.93-0.97) — np16-20
               [0.0, -1.0, 20, 0, 0, 160, 0, 0.340],
               [0.0, -1.0, 16, 0, 0, 120, 0, 0.340],
               [0.0, -1.0, 16, 0, 0, 100, 0, 0.340],
               [0.0, -1.0, 16, 0, 0, 80,  0, 0.340],
               # Low recall (0.88-0.93) — np8-12: high QPS region
               [0.0, -1.0, 12, 0, 0, 60,  0, 0.340],
               [0.0, -1.0, 12, 0, 0, 40,  0, 0.340],
               [0.0, -1.0,  8, 0, 0, 40,  0, 0.340],
               [0.0, -1.0,  8, 0, 0, 24,  0, 0.340],
               [0.0, -1.0,  8, 0, 0, 20,  0, 0.340],
               [0.0, -1.0,  4, 0, 0, 20,  0, 0.340],
               [0.0, -1.0,  4, 0, 0, 14,  0, 0.340]]
