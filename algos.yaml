            # PFAH=20 + re-prefetch + n_threads=80:
            # GOAL confirmed: np=28 ef=350 eps=0.340 → recall=0.9906 @ QPS=9236
            #                 np=28 ef=300 eps=0.345 → recall=0.9901 @ QPS=9196
            # High recall (0.98-0.99+)
