        a140-l2-saq:
          args: [{'alpha': 1.4, 'max_edges': 64, 'k_clusters': 256, 'n_entry_points': 32, 'n_cluster_seeds': 128, 'reorder': 'gorder', 'saq': true}]
          query-args:
            # [ge, gt, np, mv, rf, ef, cap, eps, rr8, pe, en, ncs]
            # SAQ: per-subspace OPQ/PCA rotation for RoutingPQ (AF_SAQ=ON + AF_SQ8=ON + AF_SOAR=ON)
            - [[0.0, -1.0,  2, 0, 0, 40, 0, -1.0, 0, 0, 0,  2],
               [0.0, -1.0,  2, 0, 0, 60, 0, -1.0, 0, 0, 0,  4],
               [0.0, -1.0,  4, 0, 0, 60, 0, -1.0, 0, 0, 0,  4],
               [0.0, -1.0,  4, 0, 0, 80, 0, -1.0, 0, 0, 0,  8],
               [0.0, -1.0,  8, 0, 0, 80, 0, -1.0, 0, 0, 0,  8],
               [0.0, -1.0,  8, 0, 0, 100, 0, -1.0, 0, 0, 0, 16],
               [0.0, -1.0, 16, 0, 0, 100, 0, -1.0, 0, 0, 0, 32],
               [0.0, -1.0, 16, 0, 0, 150, 0, -1.0, 0, 0, 0, 64],
