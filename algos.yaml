               [0.0, -1.0, 256, 0, 0, 800],
               [0.0, -1.0, 256, 0, 0, 1600]]
        a140-ang-k1024-pe50:
          args: [{'alpha': 1.4, 'max_edges': 64, 'k_clusters': 1024, 'n_entry_points': 32, 'n_cluster_seeds': 128, 'reorder': 'gorder'}]
          query-args:
            # [ge, gt, np, mv, rf, ef, cap, term_eps_fp16, rerank_sq8, pool_extra]
            # pool_extra=50: extra beam pool slots flushed to results before reranking.
            # Improves recall ~2% at ef=20-50, ~1% at ef=100 with negligible QPS cost.
            # Most effective in mid-recall range (0.80-0.93) to fill Pareto gaps.
