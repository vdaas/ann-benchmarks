        a140-l2-sq2:
          args: [{'alpha': 1.4, 'max_edges': 64, 'k_clusters': 256, 'n_entry_points': 32, 'n_cluster_seeds': 128, 'reorder': 'gorder', 'sq2_beam': true}]
          query-args:
            # [np, ef, ncs, psm, crinn, rpqgm, eps, srg, feef, wsb]
            # SQ2 beam: 2-bit packed codes, ~200 bytes/vector (fp16 1568B x1/8)
            # Higher np needed to compensate 2-bit quantization loss vs SQ4
            - [[ 4,  30,   4, 0, 0, -1.0, -1.0],
               [ 4,  40,   8, 0, 0, -1.0, -1.0],
               [ 4,  60,   8, 0, 0, -1.0, -1.0],
               [ 8,  60,  16, 0, 0, -1.0, -1.0],
