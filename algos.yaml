               [32,  80, 128, 24, 32, -1.0],
               # ef=128 rpqgm off for recall ≥ 0.99
               [48, 128, 128,  0,  0, -1.0],
               [48, 128, 128, 24, 80, -1.0],
               # ef=128 auto (rpqgm=0.2) — recall~0.98 best QPS
               [48, 128],
