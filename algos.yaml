            # NOTE: sq4_asym requires gen_sq4sq2 rebuild with routing-pq-improve SDK to add sq4_min_ to sq4.bin
            # NOTE: AoS sq4_meta (max/norm/min/inv15 interleaved 16B) reduces sq4Dist32x cache miss (+5.7% QPS)
            # NOTE: norm=||x_dec||² (quantized) not ||x||² (true) — self-consistent distance kernel
            # NOTE: inv15=range/15 precomputed in SQ4Meta eliminates hot-path division (+0.4% QPS)
            # NOTE: srg=0.10 critical: +8-10% QPS; psm=22 optimal (+0.5% recall, +1% QPS vs psm=20)
            # Post-AoS+inv15+prefetch results (2026-06-26, 7-run median):
            #   np=52 ef=130 crinn=40 ncs=128 psm=22 srg=0.10: recall=0.9909 @QPS=2270 (2259 med) ★★ BEST recall≥0.99
            #   np=52 ef=120 crinn=37 ncs=128 psm=22 srg=0.10: recall=0.9900 @QPS=2271             ★★ FASTEST (ef=120 minimum viable)
            #   np=52 ef=130 crinn=42 ncs=128 psm=22 srg=0.10: recall=0.9910 @QPS=2184 (2049 med)  ★ BEST recall
            #   np=52 ef=130 crinn=36 ncs=128 psm=22 srg=0.12: recall=0.9900 @QPS=2254 (2181 med)  high-QPS/low-crinn
            #   np=52 ef=130 crinn=45 ncs=128 psm=22 srg=0.10: recall=0.9910 @QPS=2241 (2099 med)  ref AoS-era
            #   np=56 ef=160 crinn=60 ncs=128 psm=20 srg=0.10: recall=0.9934 @QPS=1993              high recall target
            # NOTE: ef=120 is minimum for recall≥0.99 with asym SQ4 (ef=115 drops to 0.989x)
            # NOTE: crinn=37 with ef=120 saves ~8% search work vs crinn=40 with ef=130
            # NOTE: M=80 asym SQ4 (arcflare-D960-M80-K256-a1.50-ep32-cs128-gorder-rebuild-l2-rpq128-sq4-asym):
            #       recall ceiling=0.63 @ np=96 ef=240; fp16 beam recall=0.00 (bapq_perm/saq_rots SDK mismatch).
            #       M=80 graph quality insufficient for GIST-960 recall≥0.99. M=96 is minimum viable.
            # AVX2 maddubs optimization (2026-06-26, dot_q_sq4_asym_8x native AVX2 via vpmaddubsw):
            #   dot_q_sq4_asym_8x: direct maddubs(u8,s8) — no sub_epi8 shift, no (void)q_sum correction
            #   dot_q_sq4_asym_32x: #else branch uses 4x dot_q_sq4_asym_8x (was: dot_q_sq4_32x + q_sum loop)
            #   Post-AVX2 maddubs results (2026-06-26, 7-run top-1, local measurement):
            #   np=52 ef=130 crinn=40 ncs=128 psm=22 srg=0.10: recall=0.9909 @QPS=2273  ★★ BEST recall≥0.99
            #   np=52 ef=120 crinn=37 ncs=128 psm=22 srg=0.10: recall=0.9900 @QPS=2323  ★★ FASTEST
            # Official ann-benchmarks batch mode (2026-06-27, run_algorithm.py --runs 7 --batch, 80T, 1000 queries):
            #   np=52 ef=120 crinn=37 ncs=128 psm=22 srg=0.10: recall=0.9900 @QPS=2119  ★★ FASTEST (official)
            #   np=52 ef=130 crinn=40 ncs=128 psm=22 srg=0.10: recall=0.9909 @QPS=2073  ★★ BEST (official)
            # NOTE: official vs local gap ~9% (CPU thermal throttling + OS scheduler over longer test run)
            # Prefetch optimization (2026-06-27, seeding loop cache-pollution fix + block prefetch):
            #   REMOVED: routing_pq_norm_sq_ prefetch for use_local_batch path (was issuing ~203K unneeded
            #     random prefetches/query, polluting cluster_local_blocks_ L2 cache lines)
            #   ADDED: inner-loop block prefetch: PF_DIST=3 blocks ahead, 2 CL/block (head+512B)
            #   ADDED: outer-loop probe prefetch: next probe's first 2 blocks, hides inter-probe DRAM latency
            #   Post-prefetch results (2026-06-27, 7-run max, local 80T):
            #   np=52 ef=120 crinn=37 ncs=128 psm=22 srg=0.10: recall=0.9900 @QPS=2400  ★★ FASTEST (+6.8%)
            # NOTE: SRG/PSM: srg=0.10 +8-10% QPS; psm=16 optimal (+4% QPS vs psm=22, recall≥0.990 minimum)
            # NOTE: cap_cluster_members & adaptive_probe_ratio both collapse recall for GIST-960 (K=256,D=960)
            # NOTE: beam_rpq_filter_k collapses recall at values <96; no gain at 96. Keep at 0.
            # NOTE: K=4096 recall ceiling=0.904 — cannot reach 0.99. K=256 is the only viable index.
            # NOTE: np=43 (vs np=52) reduces seeding 17%, psm=16 reduces presort_cap 27% → +10% QPS total
