            #   QPS_max identical across all (2521-2541) — DRAM-bound, no winner. Default (32) is fine.
            # FINGER gate sweep (2026-07-01, 7-run, Zen2 80T, np=43 ef=152 crinn=63 psm=16 srg=0.10):
            #   fgf  recall  QPS_mean  QPS_max  vs_off
