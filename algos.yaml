            # seeding=82% of total time (L3/DRAM bandwidth bound); beam=18%
            # np=20-30 ef=400: recall ceiling 0.952-0.977 — ef cannot compensate low np (seeding quality is ceiling)
            #   np=43 ef=152 ncs=128 psm=16 crinn=63: recall=0.9900 @QPS=2418 ★★ NEW BEST (14-run, rcmin=rcmax=0.9900)
            #   np=43 ef=156 ncs=128 psm=16 crinn=63: recall=0.9900 @QPS=2410 ★★
            #   np=43 ef=170 ncs=128 psm=16 crinn=63: recall=0.9900 @QPS=2421 prev best
            #   np=43 ef=170 ncs=128 psm=22 crinn=63: recall=0.9906 @QPS=2355 ★ highest recall@np=43
            #   np=43 ef=180 ncs=128 psm=16 crinn=67: recall=0.9903 @QPS=2319 ★ safe margin
            #   np=45 ef=160 ncs=128 psm=22 crinn=60: recall=0.9904 @QPS=2207 ref (was best before np=43 sweep)
            # NOTE: AVX-512 hardware (Intel Xeon): seeding 2× faster (gpq4_batch_ip_avx512_2block auto-selected)
            #       → Amdahl: (82%/2 + 18%) = 59% of current time → QPS ≈ 2418 × 1.69 ≈ 4086 estimated
            # SIMD optimization (2026-06-27, feat/simd-opt → main):
            #   dot_q_sq4_asym_8x: added __AVX512VNNI__ path (dpbusd+_af_sq4_nib512); AVX2 path unchanged
            #   gpq4_batch_ip_avx512_4block: 4 blocks × 2 planes/iter, 8 YMM acc pairs sharing 1 ZMM LUT
            #   Index.cpp seeding loop: b+=4 outer loop precedes b+=2 and b+=1 tails
            #   Local Zen2 sweep (AVX2 only, 7-run, ArcFlare-M96-asym-batch-batch):
            #     np=43 ef=156 crinn=63 ncs=128 psm=16 srg=0.10: recall=0.9900 @QPS=2457 ★★ NEW BEST local
            #     np=43 ef=170 crinn=63 ncs=128 psm=16 srg=0.10: recall=0.9900 @QPS=2417
            #     np=52 ef=120 crinn=37 ncs=128 psm=22 srg=0.10: recall=0.9900 @QPS=2361
