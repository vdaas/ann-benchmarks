      docker-tag: ann-benchmarks-arcflare
      module: ann_benchmarks.algorithms.arcflare
      constructor: ArcFlare
      base-args: ["@metric"]
      run-groups:
        a150-ang-m96-k1024:
          args: [{'alpha': 1.5, 'max_edges': 96, 'k_clusters': 1024, 'n_entry_points': 32, 'n_cluster_seeds': 128, 'reorder': 'gorder'}]
          query-args:
            # Compact [np, ef, ncs] - M96/K1024 fp16 beam (80T):
            # NYTimes-256 alpha=1.50 (2026-07-01): does NOT exceed alpha=1.40 ceiling (0.9822).
            #   BUT: 2-3× QPS at mid-recall vs alpha=1.40 (key advantage for Pareto front):
            #   [128,600,320] → 0.9518@1455  [192,900,448] → 0.9698@955
            #   [256,1200,512] → 0.9767@712 (alpha=1.40 same: 0.9771@341 → +108% QPS)
            #   [320,1600,640] → 0.9797@535 (alpha=1.40 same: 0.9801@396 → +35% QPS)
            #   [384,2000,768] → 0.9811@449 (alpha=1.40: 0.9815@435 → +3% QPS)
            #   [512,2500,896] → 0.9818@371  [640,3000,1024] → 0.9818@316
            #   Index: arcflare-D256-M96-K1024-a1.50-ep32-cs128-gorder-ang (symlink → simd-baseline)
            - [[128,  600,  320],
               [192,  900,  448],
               [256, 1200,  512],
               [320, 1600,  640],
               [384, 2000,  768],
               [512, 2500,  896],
               [640, 3000, 1024]]
            # NYTimes-256 alpha=1.50 CRINN=60 (2026-07-01, 80T, 5-run):
            #   np  base  crinn60  delta
            #   128  1386     1904  +37.3%
            #   192   908     1388  +52.8%
            #   256   685     1106  +61.4%
            #   320   518      914  +76.4%
            #   384   433      801  +85.0%  (peak)
            #   512   363      661  +81.9%
            - [[128,  600,  320,  24,  60],
               [192,  900,  448,  24,  60],
               [256, 1200,  512,  24,  60],
               [320, 1600,  640,  24,  60],
               [384, 2000,  768,  24,  60],
               [512, 2500,  896,  24,  60]]
